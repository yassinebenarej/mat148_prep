<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MAT 148 Test 1 — prep</title>
<meta name="description" content="Checklist for MAT 148 Test 1: the nine prep steps, plus every topic, definition, theorem and proof the test covers." />
<meta name="robots" content="noindex" />
<style>
  /* OpenDyslexic — weighted letterforms, shipped with the page so there is
     no network dependency. Licence in fonts/OFL.txt. */
  @font-face {
    font-family: "OpenDyslexic";
    src: url("fonts/OpenDyslexic-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "OpenDyslexic";
    src: url("fonts/OpenDyslexic-Bold.woff2") format("woff2");
    font-weight: 600 700;
    font-style: normal;
    font-display: swap;
  }

  /* Tokens lifted from the Aced coursework page so the two read as one
     piece of software. */
  :root {
    --bg: #000000;
    --line: rgba(255, 255, 255, 0.06);
    --wa08: rgba(255, 255, 255, 0.08);
    --wa035: rgba(255, 255, 255, 0.035);
    --ink: #ececed;
    --ink-dim: #9a9aa3;
    --ink-mute: #5e5e68;
    --done: #7cc46b;

    --t-prep: #8a6a4a;
    --t-u1:   #9b91a8;
    --t-u2:   #8ea4b8;
    --t-def:  #87a07a;
    --t-thm:  #c89a3a;
    --t-prf:  #c2766c;

    --font: "OpenDyslexic", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    /* OpenDyslexic sits large for its point size and benefits from air
       between lines and letters — the readability gains come from the
       spacing as much as the letterforms. */
    line-height: 1.75;
    letter-spacing: 0.012em;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 880px; margin: 0 auto; padding: 44px 24px 120px; }

  /* ---- masthead ---- */
  .mast { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .mast .emoji { font-size: 18px; }
  .mast h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
  .mast .when {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-mute);
    letter-spacing: 0;
  }
  .lede { margin: 0 0 26px; color: var(--ink-dim); font-size: 13px; max-width: 70ch; }

  /* ---- toolbar: the coursework page's status chips ---- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .filters { display: flex; gap: 16px; }
  .chip {
    position: relative;
    background: transparent;
    border: 0;
    color: var(--ink-dim);
    padding: 4px 0;
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: inherit;
    transition: color 0.14s ease;
  }
  .chip:hover { color: var(--ink); }
  .chip.active { color: var(--ink); font-weight: 700; }
  .chip.active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1.5px;
    background: currentColor;
  }
  .chip-count { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); margin-left: 5px; letter-spacing: 0; }
  .spacer { margin-left: auto; }
  .reset {
    background: transparent; border: 0; padding: 4px 0;
    color: var(--ink-mute); font-family: inherit; font-size: 12px;
    letter-spacing: inherit; cursor: pointer;
    transition: color 0.14s ease;
  }
  .reset:hover { color: var(--ink); }

  /* ---- groups ---- */
  .group { margin-bottom: 4px; }
  .group-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--line);
    transition: color 0.16s ease;
    width: 100%;
    background: transparent;
    border-left: 0; border-right: 0; border-top: 0;
    color: var(--ink);
    font-family: inherit;
    text-align: left;
    letter-spacing: inherit;
  }
  .group-head .chev {
    color: var(--ink-mute);
    transition: transform 0.18s ease;
    width: 10px; height: 10px;
    flex: none;
  }
  .group.open .group-head .chev { transform: rotate(90deg); }
  .type-square { width: 14px; height: 14px; border-radius: 3px; background: var(--sq); flex: none; }
  .group-head .name { font-weight: 700; font-size: 14px; }
  .group-head .count { color: var(--ink-mute); font-size: 12px; font-family: var(--mono); letter-spacing: 0; }
  .progress-mini {
    flex: 0 0 100px;
    height: 4px;
    background: var(--wa08);
    border-radius: 2px;
    overflow: hidden;
    margin-left: auto;
  }
  .progress-mini-fill { height: 100%; width: 0%; background: var(--done); transition: width 0.4s ease; }

  .group-body { display: none; }
  .group.open .group-body { display: block; }

  /* ---- rows ---- */
  .row-item {
    display: grid;
    grid-template-columns: 44px 1fr;
    align-items: start;
    gap: 12px;
    padding: 11px 18px 11px 0;
    border-bottom: 1px solid var(--line);
    transition: background 0.12s ease;
    cursor: pointer;
  }
  .row-item:hover { background: var(--wa035); }
  .check-zone { display: flex; justify-content: center; padding-top: 2px; }

  .check {
    position: relative;
    width: 18px; height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--ink-mute);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.18s ease, border-color 0.18s ease;
    flex-shrink: 0;
  }
  .check svg { width: 12px; height: 12px; pointer-events: none; opacity: 0; transition: opacity 0.12s ease; }
  .check svg path {
    fill: none; stroke: #0d2510; stroke-width: 2.4;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .row-item input { position: absolute; opacity: 0; width: 0; height: 0; }
  .row-item input:checked + .check { background: var(--done); border-color: var(--done); }
  .row-item input:checked + .check svg { opacity: 1; }
  .row-item input:focus-visible + .check { outline: 2px solid var(--ink-dim); outline-offset: 2px; }

  /* These are spans inside a label, so they need to be told to stack —
     otherwise the subtitle runs on from the end of the title. */
  .title-wrap { min-width: 0; display: block; }
  .title { display: block; font-weight: 400; font-size: 14px; }
  .idx { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); margin-right: 8px; letter-spacing: 0; }
  .subtitle { display: block; font-size: 11.5px; color: var(--ink-mute); margin-top: 3px; line-height: 1.6; }
  .subtitle code { font-family: var(--mono); font-size: 11px; letter-spacing: 0; }

  .row-item.done .title { text-decoration: line-through; color: var(--ink-mute); }
  .row-item.done .subtitle { opacity: 0.55; }

  footer {
    margin-top: 44px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--ink-mute);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }
  @media (max-width: 560px) {
    .page { padding: 28px 16px 80px; }
    .progress-mini { flex-basis: 60px; }
    .row-item { grid-template-columns: 32px 1fr; padding-right: 0; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="mast">
    <span class="emoji">📐</span>
    <h1>MAT 148 · Test 1</h1>
    <span class="when">Thu 22 Oct · 5:10–7:00pm · 110 min · no aids</span>
  </div>
  <p class="lede">
    Everything the Test 1 announcement asks you to do, as one set of boxes.
    Ticks are kept in this browser.
  </p>

  <div class="toolbar">
    <div class="filters">
      <button class="chip active" data-filter="todo" type="button">To do <span class="chip-count" id="c-todo">0</span></button>
      <button class="chip" data-filter="done" type="button">Done <span class="chip-count" id="c-done">0</span></button>
      <button class="chip" data-filter="all" type="button">All <span class="chip-count" id="c-all">0</span></button>
    </div>
    <span class="spacer"></span>
    <button class="reset" id="reset" type="button">Clear all</button>
  </div>

  <div id="groups"></div>

  <footer>
    <span>From the Test 1 announcement — check Quercus before relying on it.</span>
    <span>Ticks stored in this browser only.</span>
  </footer>
</div>

<script>
(function () {
  var KEY = 'mat148-test1-checklist';

  var GROUPS = [
    { id: 'prep', name: 'Prep', color: 'var(--t-prep)', numbered: true, items: [
      { id: 'p1', t: 'Rewatch every Unit 1 and Unit 2 video', s: 'Make sure you follow them, not just that you have seen them.' },
      { id: 'p2', t: 'Review the pre-class quizzes for Units 1 and 2', s: 'Redo every question you got wrong.' },
      { id: 'p3', t: 'Go through all your lecture notes', s: 'Covering every topic in the lists below.' },
      { id: 'p4', t: 'Work every question in Tutorials 1–4' },
      { id: 'p5', t: 'Work every question in Tutorial Quiz 1 and Tutorial Quiz 2' },
      { id: 'p6', t: 'Work the Unit 1 and Unit 2 practice problems' },
      { id: 'p7', t: 'Computation Quiz 1 on Mathmatize — all but the last four', s: 'Repeat until you can do them quickly, not just correctly.' },
      { id: 'p8', t: 'Problem set A', s: '<code>148_F26_PSA.pdf</code> — nothing to hand in. Only covers what past sets and tutorials did not. Solutions: <code>148_F26_PSA_Sol.pdf</code>' },
      { id: 'p9', t: 'Take what is left to office hours or Piazza' }
    ]},
    { id: 'u1', name: 'Unit 1 — Logic, notation, definitions, proofs', color: 'var(--t-u1)', items: [
      { id: 'u1a', t: 'Set notation' },
      { id: 'u1b', t: 'Negating a statement' },
      { id: 'u1c', t: 'Quantifiers' },
      { id: 'u1d', t: 'If–then statements' },
      { id: 'u1e', t: 'Define a new concept, then use it to solve a question' },
      { id: 'u1f', t: 'Induction', s: 'Strong induction is not on Test 1.' }
    ]},
    { id: 'u2', name: 'Unit 2 — Limits', color: 'var(--t-u2)', items: [
      { id: 'u2a', t: 'Definition of a limit', s: 'The ε–δ definitions in their variations — e.g. Q5 in the Unit 2 practice problems.' },
      { id: 'u2b', t: 'Read limits off a given graph' },
      { id: 'u2c', t: 'Construct a graph satisfying several conditions' },
      { id: 'u2d', t: 'Evaluate simple limits' },
      { id: 'u2e', t: 'Continuity' },
      { id: 'u2f', t: 'Proving a limit' },
      { id: 'u2g', t: 'Limit laws' },
      { id: 'u2h', t: 'Limit computations', s: 'Computation Quiz 1 on Mathmatize is the practice for this.' },
      { id: 'u2i', t: 'State the EVT and the IVT', s: 'Hypothesis and conclusion, both.' },
      { id: 'u2j', t: 'Use the EVT and IVT to write proofs' }
    ]},
    { id: 'def', name: 'Definitions to write cold', color: 'var(--t-def)', items: [
      { id: 'd1', t: 'Even and odd integers' },
      { id: 'd2', t: 'Rational numbers' },
      { id: 'd3', t: 'One-to-one function' },
      { id: 'd4', t: '(Strictly) increasing function' },
      { id: 'd5', t: 'Bounded function' },
      { id: 'd6', t: 'ε–δ definition of a limit', s: 'In its several variations — e.g. Q5, Unit 2 practice problems.' },
      { id: 'd7', t: 'ε–δ definition of continuity' },
      { id: 'd8', t: 'Maximum and minimum' }
    ]},
    { id: 'thm', name: 'Theorems to know', color: 'var(--t-thm)', items: [
      { id: 't1', t: 'A (strictly) increasing function is one-to-one' },
      { id: 't2', t: 'The limit laws' },
      { id: 't3', t: 'The Squeeze Theorem, and the new Squeeze Theorem' },
      { id: 't4', t: 'The continuity theorems', s: '2.15 and 2.16.' },
      { id: 't5', t: 'The Intermediate Value Theorem' },
      { id: 't6', t: 'The Extreme Value Theorem' }
    ]},
    { id: 'prf', name: 'Proofs to write cold', color: 'var(--t-prf)', items: [
      { id: 'r1', t: 'Direct proof' },
      { id: 'r2', t: 'Proof by contrapositive' },
      { id: 'r3', t: 'Proof by induction', s: 'Strong induction is not covered on Test 1.' },
      { id: 'r4', t: 'ε–δ proof of a limit', s: 'Including the sum limit law and the Squeeze Theorem.' },
      { id: 'r5', t: 'Prove a function is continuous at a point, from the ε–δ definition' },
      { id: 'r6', t: 'Proof using the EVT and the IVT' }
    ]}
  ];

  var TICK = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5 L6.5 12 L13 4.5" /></svg>';

  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }
  var openState = {};
  try { openState = JSON.parse(localStorage.getItem(KEY + '-open') || '{}') || {}; } catch (e) { openState = {}; }

  var filter = 'todo';
  var root = document.getElementById('groups');

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  root.innerHTML = GROUPS.map(function (g) {
    var rows = g.items.map(function (it, i) {
      return '<label class="row-item" data-item="' + it.id + '">' +
        '<span class="check-zone">' +
          '<input type="checkbox" data-id="' + it.id + '" />' +
          '<span class="check">' + TICK + '</span>' +
        '</span>' +
        '<span class="title-wrap">' +
          '<span class="title">' + (g.numbered ? '<span class="idx">' + (i + 1) + '</span>' : '') + esc(it.t) + '</span>' +
          (it.s ? '<span class="subtitle">' + it.s + '</span>' : '') +
        '</span>' +
      '</label>';
    }).join('');

    return '<div class="group' + (openState[g.id] === false ? '' : ' open') + '" data-group="' + g.id + '" style="--sq:' + g.color + '">' +
      '<button class="group-head" type="button" aria-expanded="true">' +
        '<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4.5 2.5 8.5 6 4.5 9.5" /></svg>' +
        '<span class="type-square"></span>' +
        '<span class="name">' + esc(g.name) + '</span>' +
        '<span class="count"></span>' +
        '<span class="progress-mini"><span class="progress-mini-fill"></span></span>' +
      '</button>' +
      '<div class="group-body">' + rows + '</div>' +
    '</div>';
  }).join('');

  var boxes = Array.prototype.slice.call(root.querySelectorAll('input[type=checkbox]'));

  function save() {
    var out = {};
    boxes.forEach(function (b) { if (b.checked) out[b.dataset.id] = 1; });
    try { localStorage.setItem(KEY, JSON.stringify(out)); } catch (e) {}
  }
  function saveOpen() {
    try { localStorage.setItem(KEY + '-open', JSON.stringify(openState)); } catch (e) {}
  }

  function render() {
    var done = 0;
    boxes.forEach(function (b) {
      var row = b.closest('.row-item');
      row.classList.toggle('done', b.checked);
      if (b.checked) done++;
      var show = filter === 'all' || (filter === 'done' ? b.checked : !b.checked);
      row.style.display = show ? '' : 'none';
    });

    document.getElementById('c-todo').textContent = String(boxes.length - done);
    document.getElementById('c-done').textContent = String(done);
    document.getElementById('c-all').textContent = String(boxes.length);

    GROUPS.forEach(function (g) {
      var el = root.querySelector('[data-group="' + g.id + '"]');
      var ins = el.querySelectorAll('input[type=checkbox]');
      var hit = el.querySelectorAll('input[type=checkbox]:checked').length;
      el.querySelector('.count').textContent = hit + '/' + ins.length;
      el.querySelector('.progress-mini-fill').style.width = (ins.length ? (hit / ins.length) * 100 : 0) + '%';
      // A group with nothing left to show under the active filter collapses
      // out of the way rather than leaving a header over empty space.
      var visible = Array.prototype.filter.call(ins, function (b) {
        return b.closest('.row-item').style.display !== 'none';
      }).length;
      el.style.display = visible === 0 && filter !== 'all' ? 'none' : '';
    });
  }

  boxes.forEach(function (b) {
    if (saved[b.dataset.id]) b.checked = true;
    b.addEventListener('change', function () { save(); render(); });
  });

  root.querySelectorAll('.group-head').forEach(function (h) {
    h.addEventListener('click', function () {
      var g = h.closest('.group');
      var id = g.dataset.group;
      var open = g.classList.toggle('open');
      h.setAttribute('aria-expanded', String(open));
      openState[id] = open;
      saveOpen();
    });
  });

  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('.chip').forEach(function (x) { x.classList.remove('active'); });
      c.classList.add('active');
      filter = c.dataset.filter;
      render();
    });
  });

  document.getElementById('reset').addEventListener('click', function () {
    boxes.forEach(function (b) { b.checked = false; });
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
