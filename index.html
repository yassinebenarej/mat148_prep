<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MAT 148 — test prep</title>
<meta name="description" content="Checklists for MAT 148 Tests 1 and 2: the prep steps, plus every topic, definition, theorem and proof each test covers." />
<meta name="robots" content="noindex" />
<!-- A radical, drawn rather than typed: no glyph to go missing, and it
     stays legible down to the 16px the tab strip actually renders. -->
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css?v=15" />
</head>
<body>

<div class="page">

  <div class="tests" role="tablist" aria-label="Test">
    <button class="test-tab" role="tab" data-test="t1" type="button">Test 1</button>
    <button class="test-tab" role="tab" data-test="t2" type="button">Test 2</button>
  </div>

  <div class="mast">
    <span class="emoji">📐</span>
    <h1 id="mast-title">MAT 148</h1>
    <span class="when" id="mast-when"></span>
  </div>

  <div class="toolbar">
    <div class="filters">
      <button class="chip active" data-filter="todo" type="button">To do <span class="chip-count" id="c-todo">0</span></button>
      <button class="chip" data-filter="done" type="button">Done <span class="chip-count" id="c-done">0</span></button>
      <button class="chip" data-filter="all" type="button">All <span class="chip-count" id="c-all">0</span></button>
    </div>
    <span class="spacer"></span>
    <a class="navlink" href="astuces.html">Astuces<span class="arrow">&rsaquo;</span></a>
    <a class="navlink" href="past-exams.html">Past exams<span class="arrow">&rsaquo;</span></a>
    <a class="navlink" href="summaries.html">Summaries<span class="arrow">&rsaquo;</span></a>
    <a class="navlink" href="weaknesses.html">Weaknesses<span class="arrow">&rsaquo;</span></a>
  </div>

  <div id="groups"></div>

</div>

<script>
(function () {
  var T1 = [
    { id: 'prep', name: 'Prep', color: 'var(--t-prep)', numbered: true, items: [
      { id: 'p1', t: 'Rewatch every Unit 1 and Unit 2 video', s: 'Make sure you follow them, not just that you have seen them.' },
      { id: 'p2', t: 'Review the pre-class quizzes for Units 1 and 2', s: 'Redo every question you got wrong.' },
      { id: 'p3', t: 'Go through all your lecture notes', s: 'Covering every topic in the lists below.' },
      { id: 'p4', t: 'Work every question in Tutorials 1–4' },
      { id: 'p5', t: 'Work every question in Tutorial Quiz 1 and Tutorial Quiz 2' },
      { id: 'p6', t: 'Work the Unit 1 and Unit 2 practice problems' },
      { id: 'p7', t: 'Computation Quiz 1 on Mathmatize — all but the last four', s: 'Repeat until you can do them quickly, not just correctly.' },
      { id: 'p8', t: 'Problem set A', s: '<code>148_F26_PSA.pdf</code> — nothing to hand in. Only covers what past sets and tutorials did not. Solutions: <code>148_F26_PSA_Sol.pdf</code>' },
      { id: 'p9', t: 'Take what is left to office hours or Piazza' }
    ]},
    { id: 'u1', name: 'Unit 1 — Logic, notation, definitions, proofs', color: 'var(--t-u1)', items: [
      { id: 'u1a', t: 'Set notation' },
      { id: 'u1b', t: 'Negating a statement' },
      { id: 'u1c', t: 'Quantifiers' },
      { id: 'u1d', t: 'If–then statements' },
      { id: 'u1e', t: 'Define a new concept, then use it to solve a question' },
      { id: 'u1f', t: 'Induction', s: 'Strong induction is not on Test 1.' }
    ]},
    { id: 'u2', name: 'Unit 2 — Limits', color: 'var(--t-u2)', items: [
      { id: 'u2a', t: 'Definition of a limit', s: 'The ε–δ definitions in their variations — e.g. Q5 in the Unit 2 practice problems.' },
      { id: 'u2b', t: 'Read limits off a given graph' },
      { id: 'u2c', t: 'Construct a graph satisfying several conditions' },
      { id: 'u2d', t: 'Evaluate simple limits' },
      { id: 'u2e', t: 'Continuity' },
      { id: 'u2f', t: 'Proving a limit' },
      { id: 'u2g', t: 'Limit laws' },
      { id: 'u2h', t: 'Limit computations', s: 'Computation Quiz 1 on Mathmatize is the practice for this.' },
      { id: 'u2i', t: 'State the EVT and the IVT', s: 'Hypothesis and conclusion, both.' },
      { id: 'u2j', t: 'Use the EVT and IVT to write proofs' }
    ]},
    { id: 'def', name: 'Definitions to write cold', color: 'var(--t-def)', items: [
      { id: 'd1', t: 'Even and odd integers' },
      { id: 'd2', t: 'Rational numbers' },
      { id: 'd3', t: 'One-to-one function' },
      { id: 'd4', t: '(Strictly) increasing function' },
      { id: 'd5', t: 'Bounded function' },
      { id: 'd6', t: 'ε–δ definition of a limit', s: 'In its several variations — e.g. Q5, Unit 2 practice problems.' },
      { id: 'd7', t: 'ε–δ definition of continuity' },
      { id: 'd8', t: 'Maximum and minimum' }
    ]},
    { id: 'thm', name: 'Theorems to know', color: 'var(--t-thm)', items: [
      { id: 't1', t: 'A (strictly) increasing function is one-to-one' },
      { id: 't2', t: 'The limit laws' },
      { id: 't3', t: 'The Squeeze Theorem, and the new Squeeze Theorem' },
      { id: 't4', t: 'The continuity theorems', s: '2.15 and 2.16.' },
      { id: 't5', t: 'The Intermediate Value Theorem' },
      { id: 't6', t: 'The Extreme Value Theorem' }
    ]},
    { id: 'prf', name: 'Proofs to write cold', color: 'var(--t-prf)', items: [
      { id: 'r1', t: 'Direct proof' },
      { id: 'r2', t: 'Proof by contrapositive' },
      { id: 'r3', t: 'Proof by induction', s: 'Strong induction is not covered on Test 1.' },
      { id: 'r4', t: 'ε–δ proof of a limit', s: 'Including the sum limit law and the Squeeze Theorem.' },
      { id: 'r5', t: 'Prove a function is continuous at a point, from the ε–δ definition' },
      { id: 'r6', t: 'Proof using the EVT and the IVT' }
    ]}
  ];

  var T2 = [
    { id: 'prep', name: 'Prep', color: 'var(--t-prep)', numbered: true, items: [
      { id: 'p1', t: 'Rewatch every Unit 3, Unit 4 and Unit 5 video', s: 'Unit 5 up to 5.9 only. Make sure you follow them, not just that you have seen them.' },
      { id: 'p2', t: 'Review pre-class Quizzes 16–27', s: 'Redo every question you got wrong.' },
      { id: 'p3', t: 'Go through all your lecture notes' },
      { id: 'p4', t: 'Work every question in Tutorials 5, 6 and 7' },
      { id: 'p5', t: 'Redo what you got wrong in Tutorial Quiz 3' },
      { id: 'p6', t: 'Computation Quiz 2 — finish it before the test', s: 'This is the practice for the computation part.' },
      { id: 'p7', t: 'Work the Unit 3, 4 and 5 practice problems' },
      { id: 'p8', t: 'Problem set B', s: '<code>148F26_PSB.pdf</code> — nothing to hand in. Not comprehensive: only problems not in past assessments. Solutions posted at least a week before 26 Nov.' },
      { id: 'p9', t: 'Take what is left to office hours or Piazza' }
    ]},
    { id: 'u3', name: 'Unit 3 — Derivatives', color: 'var(--t-u3)', items: [
      { id: 'u3a', t: 'Definition of the derivative as a limit' },
      { id: 'u3b', t: 'Prove the derivative rules', s: 'e.g. the product rule and the quotient rule.' },
      { id: 'u3c', t: 'Compute derivatives with the rules' },
      { id: 'u3d', t: 'Implicit differentiation' },
      { id: 'u3e', t: 'Logarithmic differentiation' },
      { id: 'u3f', t: 'Compute a derivative from the definition' },
      { id: 'u3g', t: 'Higher-order derivatives' },
      { id: 'u3h', t: 'Geometric meaning of the derivative', s: 'Tangent lines, and applications such as linear approximation.' },
      { id: 'u3i', t: 'Linear approximation' },
      { id: 'u3j', t: 'Prove a simple derivative directly from the limit definition' },
      { id: 'u3k', t: 'Differentiability vs continuity', s: 'Differentiable ⇒ continuous, and why the converse fails (e.g. |x| at 0).' }
    ]},
    { id: 'u4', name: 'Unit 4 — Transcendental functions', color: 'var(--t-u4)', items: [
      { id: 'u4a', t: 'Definition of the inverse function' },
      { id: 'u4b', t: 'Characterize which functions are invertible', s: 'One-to-one; for continuous functions on an interval, strictly monotonic.' },
      { id: 'u4c', t: 'Derivative of the inverse function' },
      { id: 'u4d', t: 'Derivatives of exponential and logarithmic functions' },
      { id: 'u4e', t: 'Derivatives of trig functions' },
      { id: 'u4f', t: 'Define the inverse trig functions', s: 'Including the restricted domain each one is built on.' },
      { id: 'u4g', t: 'Sketch the graphs of the inverse trig functions' },
      { id: 'u4h', t: 'Derive the inverse trig derivative formulas' },
      { id: 'u4i', t: 'Simplify trig ∘ inverse trig', s: 'e.g. tan(arcsec x) — draw the triangle, watch the sign.' }
    ]},
    { id: 'u5', name: 'Unit 5 — Mean Value Theorems (to 5.9)', color: 'var(--t-u5)', items: [
      { id: 'u5a', t: "State Rolle's Theorem", s: 'Hypothesis and conclusion, both.' },
      { id: 'u5b', t: 'State the Mean Value Theorem', s: 'Hypothesis and conclusion, both.' },
      { id: 'u5c', t: 'Find the critical points' },
      { id: 'u5d', t: 'Definitions of local and global extrema' },
      { id: 'u5e', t: 'Find the local extrema' },
      { id: 'u5f', t: 'Find the global extrema' },
      { id: 'u5g', t: "Use Rolle's Theorem and the MVT to write proofs" },
      { id: 'u5h', t: 'Read extrema and critical points off the graph of f′' }
    ]},
    { id: 'def', name: 'Definitions to write cold', color: 'var(--t-def)', items: [
      { id: 'd1', t: 'Local extremum (max and min)' },
      { id: 'd2', t: 'Global extremum (max and min)' },
      { id: 'd3', t: 'Derivative as a limit' },
      { id: 'd4', t: 'One-to-one function' },
      { id: 'd5', t: 'Increasing and decreasing function' },
      { id: 'd6', t: 'Inverse function' },
      { id: 'd7', t: 'Critical point' }
    ]},
    { id: 'thm', name: 'Theorems to know', color: 'var(--t-thm)', items: [
      { id: 't1', t: 'Differentiability implies continuity' },
      { id: 't2', t: "Rolle's Theorem" },
      { id: 't3', t: 'The Mean Value Theorem' },
      { id: 't4', t: 'f′ = 0 implies f is constant', s: 'The theorem in 5.9.' }
    ]},
    { id: 'prf', name: 'Proofs to write cold', color: 'var(--t-prf)', items: [
      { id: 'r1', t: 'Differentiability implies continuity' },
      { id: 'r2', t: 'The product rule' },
      { id: 'r3', t: 'The quotient rule' },
      { id: 'r4', t: 'A simple derivative from the limit definition' },
      { id: 'r5', t: 'The derivative of an inverse trig function' },
      { id: 'r6', t: "A proof using Rolle's Theorem", s: 'e.g. an equation has at most one root.' },
      { id: 'r7', t: 'A proof using the MVT', s: 'e.g. an inequality, or an equality.' },
      { id: 'r8', t: 'f′ = 0 on an interval ⇒ f is constant' }
    ]},
    { id: 'qt', name: 'The four question types', color: 'var(--t-u1)', items: [
      { id: 'q1', t: 'Computations', s: 'Derivatives from the definition, with the rules, implicitly, logarithmically; the derivative of an inverse; higher-order derivatives.' },
      { id: 'q2', t: 'Applications', s: 'Linear approximation; using the MVT to prove an inequality or equality.' },
      { id: 'q3', t: 'Conceptual', s: 'Extrema and critical points from the graph of f′; state definitions and theorems; how the inverse function is defined.' },
      { id: 'q4', t: 'Proofs', s: 'Differentiability ⇒ continuity; differentiation rules; Rolle and MVT proofs.' }
    ]}
  ];

  var TESTS = {
    t1: { key: 'mat148-test1-checklist', title: 'MAT 148 · Test 1', when: 'Thu 22 Oct · 5:10–7:00pm · 110 min · no aids', groups: T1 },
    t2: { key: 'mat148-test2-checklist', title: 'MAT 148 · Test 2', when: 'Thu 26 Nov · Units 3–5 (to 5.9)', groups: T2 }
  };
  var TAB_KEY = 'mat148-active-test';

  var TICK = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5 L6.5 12 L13 4.5" /></svg>';

  var filter = 'todo';
  var root = document.getElementById('groups');
  var current, test, GROUPS, KEY, saved, openState, boxes;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function load(k, fallback) {
    try { return JSON.parse(localStorage.getItem(k) || fallback) || JSON.parse(fallback); } catch (e) { return JSON.parse(fallback); }
  }

  function save() {
    var out = {};
    boxes.forEach(function (b) { if (b.checked) out[b.dataset.id] = 1; });
    try { localStorage.setItem(KEY, JSON.stringify(out)); } catch (e) {}
  }
  function saveOpen() {
    try { localStorage.setItem(KEY + '-open', JSON.stringify(openState)); } catch (e) {}
  }

  /* Each test keeps its own ticks and open groups under its own key, so
   * switching tabs rebuilds the list from that test's data. Item ids only
   * need to be unique within a test. */
  function build(id) {
    current = id;
    test = TESTS[id];
    GROUPS = test.groups;
    KEY = test.key;
    saved = load(KEY, '{}');
    openState = load(KEY + '-open', '{}');

    document.getElementById('mast-title').textContent = test.title;
    document.getElementById('mast-when').textContent = test.when;
    document.title = test.title.replace(' · ', ' ') + ' — prep';
    document.querySelectorAll('.test-tab').forEach(function (t) {
      var on = t.dataset.test === id;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', String(on));
    });
    try { localStorage.setItem(TAB_KEY, id); } catch (e) {}
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);

    root.innerHTML = GROUPS.map(function (g) {
      var rows = g.items.map(function (it, i) {
        return '<label class="row-item" data-item="' + it.id + '">' +
          '<span class="check-zone">' +
            '<input type="checkbox" data-id="' + it.id + '" />' +
            '<span class="check">' + TICK + '</span>' +
          '</span>' +
          '<span class="title-wrap">' +
            '<span class="title">' + (g.numbered ? '<span class="idx">' + (i + 1) + '</span>' : '') + esc(it.t) + '</span>' +
            (it.s ? '<span class="subtitle">' + it.s + '</span>' : '') +
          '</span>' +
        '</label>';
      }).join('');

      return '<div class="group' + (openState[g.id] === false ? '' : ' open') + '" data-group="' + g.id + '" style="--sq:' + g.color + '">' +
        '<button class="group-head" type="button" aria-expanded="' + (openState[g.id] === false ? 'false' : 'true') + '">' +
          '<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4.5 2.5 8.5 6 4.5 9.5" /></svg>' +
          '<span class="type-square"></span>' +
          '<span class="name">' + esc(g.name) + '</span>' +
          '<span class="count"></span>' +
          '<span class="progress-mini"><span class="progress-mini-fill"></span></span>' +
        '</button>' +
        '<div class="group-body">' + rows + '</div>' +
      '</div>';
    }).join('');

    boxes = Array.prototype.slice.call(root.querySelectorAll('input[type=checkbox]'));
    boxes.forEach(function (b) {
      if (saved[b.dataset.id]) b.checked = true;
      b.addEventListener('change', function () { save(); render(); });
    });

    root.querySelectorAll('.group-head').forEach(function (h) {
      h.addEventListener('click', function () {
        var g = h.closest('.group');
        var open = g.classList.toggle('open');
        h.setAttribute('aria-expanded', String(open));
        openState[g.dataset.group] = open;
        saveOpen();
      });
    });

    render();
  }

  function render() {
    var done = 0;
    boxes.forEach(function (b) {
      var row = b.closest('.row-item');
      row.classList.toggle('done', b.checked);
      if (b.checked) done++;
      var show = filter === 'all' || (filter === 'done' ? b.checked : !b.checked);
      row.style.display = show ? '' : 'none';
    });

    document.getElementById('c-todo').textContent = String(boxes.length - done);
    document.getElementById('c-done').textContent = String(done);
    document.getElementById('c-all').textContent = String(boxes.length);

    GROUPS.forEach(function (g) {
      var el = root.querySelector('[data-group="' + g.id + '"]');
      var ins = el.querySelectorAll('input[type=checkbox]');
      var hit = el.querySelectorAll('input[type=checkbox]:checked').length;
      el.querySelector('.count').textContent = hit + '/' + ins.length;
      el.querySelector('.progress-mini-fill').style.width = (ins.length ? (hit / ins.length) * 100 : 0) + '%';
      // A group with nothing left to show under the active filter collapses
      // out of the way rather than leaving a header over empty space.
      var visible = Array.prototype.filter.call(ins, function (b) {
        return b.closest('.row-item').style.display !== 'none';
      }).length;
      el.style.display = visible === 0 && filter !== 'all' ? 'none' : '';
    });
  }

  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('.chip').forEach(function (x) { x.classList.remove('active'); });
      c.classList.add('active');
      filter = c.dataset.filter;
      render();
    });
  });

  document.querySelectorAll('.test-tab').forEach(function (t) {
    t.addEventListener('click', function () { if (t.dataset.test !== current) build(t.dataset.test); });
  });
  window.addEventListener('hashchange', function () {
    var h = location.hash.slice(1);
    if (TESTS[h] && h !== current) build(h);
  });

  // A #t1 / #t2 link wins; otherwise the last tab used; otherwise Test 2,
  // the one coming up.
  var start = location.hash.slice(1);
  if (!TESTS[start]) { try { start = localStorage.getItem(TAB_KEY); } catch (e) { start = null; } }
  build(TESTS[start] ? start : 't2');
})();
</script>
</body>
</html>
